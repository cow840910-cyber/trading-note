<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交易複盤">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme:light)">
<title>交易複盤</title>
<style>
:root{
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --bg:#f2f2f7;--card:#ffffff;--card2:#f2f2f7;
  --tx:#1c1c1e;--tx2:#636366;--tx3:#aeaeb2;
  --br:rgba(60,60,67,.15);--br2:rgba(60,60,67,.25);
  --g:#15803d;--gbg:#f0fdf4;--gbr:#bbf7d0;
  --r:#dc2626;--rbg:#fef2f2;--rbr:#fecaca;
  --y:#d97706;--ybg:#fffbeb;--ybr:#fde68a;
  --b:#2563eb;--bbg:#eff6ff;--bbr:#bfdbfe;
  --acc:#1c1c1e;
  --rad:10px;--rad2:14px;
  --hh:60px;--nh:56px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000000;--card:#1c1c1e;--card2:#2c2c2e;
  --tx:#ffffff;--tx2:rgba(235,235,245,.7);--tx3:rgba(235,235,245,.4);
  --br:rgba(255,255,255,.1);--br2:rgba(255,255,255,.2);
  --g:#34d399;--gbg:#022c22;--gbr:#065f46;
  --r:#f87171;--rbg:#2d0a0a;--rbr:#7f1d1d;
  --y:#fbbf24;--ybg:#1c1200;--ybr:#78350f;
  --b:#60a5fa;--bbg:#0c1a3a;--bbr:#1e3a6e;
  --acc:#ffffff;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--tx);background:var(--bg);height:100%;overflow:hidden}
#root{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Header */
#hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border-bottom:.5px solid var(--br);
  padding:calc(var(--st) + 10px) 16px 10px;min-height:calc(var(--st) + var(--hh))}
.hdr-s{font-size:10px;color:var(--tx2);letter-spacing:1px;margin-bottom:1px}
.hdr-t{font-size:19px;font-weight:700;letter-spacing:-.3px}
.btn-add{display:flex;align-items:center;gap:5px;padding:8px 16px;
  background:var(--acc);color:var(--bg);border:none;border-radius:var(--rad);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  -webkit-touch-callout:none}

/* Content */
#cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}

/* Bottom Nav */
#nav{flex-shrink:0;display:flex;background:var(--card);border-top:.5px solid var(--br);
  padding-bottom:var(--sb)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 6px;background:none;border:none;cursor:pointer;font-family:inherit;
  -webkit-touch-callout:none}
.nb-ic{font-size:24px;line-height:1}
.nb-lb{font-size:10px;font-weight:500}

/* Modal */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  display:flex;flex-direction:column;justify-content:flex-end;
  animation:fadeIn .2s ease}
.m-sheet{background:var(--card);border-radius:20px 20px 0 0;
  max-height:94dvh;display:flex;flex-direction:column;
  animation:slideUp .32s cubic-bezier(.32,.72,0,1)}
.m-han{width:36px;height:4px;background:var(--br2);border-radius:2px;
  margin:10px auto 4px;flex-shrink:0}
.m-hd{padding:4px 16px 12px;border-bottom:.5px solid var(--br);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.m-hd-t{font-size:17px;font-weight:700}
.m-close{background:none;border:none;color:var(--tx2);font-size:28px;
  cursor:pointer;line-height:1;padding:0 4px;font-family:inherit;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--card2)}
.m-scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.m-ft{padding:12px 16px;padding-bottom:calc(12px + var(--sb));
  border-top:.5px solid var(--br);flex-shrink:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* Page pad */
.pad{padding:12px 16px 4px}

/* Day group */
.day-g{margin-bottom:20px}
.day-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:7px 12px;background:var(--card);border-radius:var(--rad);margin-bottom:8px;
  border-left:3px solid var(--g)}
.day-hdr.neg{border-left-color:var(--r)}
.day-date{font-size:12px;color:var(--tx2);font-weight:500}
.day-pnl{font-family:'SF Mono',monospace;font-size:13px;font-weight:600}

/* Trade Card */
.tc{background:var(--card);border-radius:var(--rad2);margin-bottom:8px;
  overflow:hidden;border:.5px solid var(--br)}
.tc-top{display:flex;align-items:center;gap:10px;padding:13px 12px;
  cursor:pointer;user-select:none;-webkit-user-select:none}
.tc-top:active{background:var(--card2)}
.tc-det{border-top:.5px solid var(--br);padding:13px}
.dir{display:inline-block;padding:3px 8px;border-radius:6px;
  font-size:11px;font-weight:700;flex-shrink:0;letter-spacing:.3px}
.dir-l{background:var(--gbg);color:var(--g)}
.dir-s{background:var(--rbg);color:var(--r)}
.tc-name{font-size:14px;font-weight:500;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-price{font-family:'SF Mono',monospace;font-size:12px;color:var(--tx2)}
.tc-pnl{text-align:right;flex-shrink:0;margin-right:4px}
.tc-pnl-num{font-family:'SF Mono',monospace;font-size:16px;font-weight:700}
.tc-pnl-unit{font-size:10px;color:var(--tx2);margin-top:1px}
.chev{flex-shrink:0;color:var(--tx2);transition:transform .18s ease;display:inline-flex}
.chev.op{transform:rotate(180deg)}
.mono{font-family:'SF Mono',monospace}
.profit{color:var(--g)}.lossc{color:var(--r)}

/* Card detail */
.imgs-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;
  -webkit-overflow-scrolling:touch}
.ith{height:96px;border-radius:10px;border:.5px solid var(--br);
  object-fit:cover;flex-shrink:0}
.ith-ph{height:96px;width:96px;border-radius:10px;background:var(--card2);
  flex-shrink:0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.det-label{font-size:11px;color:var(--tx2);margin-bottom:5px;font-weight:500;letter-spacing:.3px}
.det-label-y{font-size:11px;color:var(--y);margin-bottom:5px;font-weight:500;
  display:flex;align-items:center;gap:4px}
.tbox{font-size:13px;line-height:1.65;border-radius:var(--rad);padding:10px 12px;margin-bottom:10px}
.tlog{background:var(--card2)}
.timp{background:var(--ybg);border-left:2px solid var(--y)}
.act-row{display:flex;gap:8px;margin-top:4px}
.act-edit{flex:1;padding:10px;background:var(--card2);border:.5px solid var(--br2);
  border-radius:var(--rad);color:var(--tx);font-size:13px;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
.act-del{padding:10px 14px;background:var(--rbg);border:.5px solid var(--rbr);
  border-radius:var(--rad);color:var(--r);font-size:13px;cursor:pointer;font-family:inherit}
.act-edit:active,.act-del:active{opacity:.7}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60dvh;gap:14px;color:var(--tx2);text-align:center;line-height:1.8;font-size:14px}

/* Stats */
.mo-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
  -webkit-overflow-scrolling:touch}
.mo-pill{flex-shrink:0;padding:5px 15px;border-radius:20px;
  font-size:12px;font-family:'SF Mono',monospace;cursor:pointer;
  border:.5px solid var(--br2);background:none;color:var(--tx2)}
.mo-pill.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.tot-card{padding:20px;border-radius:var(--rad2);text-align:center;margin-bottom:14px;
  border-left:3px solid}
.tot-lb{font-size:11px;color:var(--tx2);margin-bottom:4px;font-weight:500;letter-spacing:.5px}
.tot-amt{font-family:'SF Mono',monospace;font-size:32px;font-weight:700;line-height:1.1}
.tot-sub{font-size:11px;color:var(--tx2);margin-top:5px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sc{background:var(--card);border-radius:var(--rad);padding:12px 13px;
  border:.5px solid var(--br)}
.sc-lb{font-size:11px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.sc-v{font-family:'SF Mono',monospace;font-size:18px;font-weight:600}
.day-sec-hdr{font-size:11px;color:var(--tx2);font-weight:500;
  margin-bottom:8px;letter-spacing:.3px}
.drow{display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;background:var(--card);border-radius:var(--rad);
  margin-bottom:4px;border:.5px solid var(--br)}
.ddot{width:3px;height:17px;border-radius:2px;flex-shrink:0}

/* Form */
.field{margin-bottom:14px}
.fl{font-size:11px;color:var(--tx2);margin-bottom:6px;font-weight:500;letter-spacing:.3px}
.fl-y{font-size:11px;color:var(--y);margin-bottom:6px;font-weight:500;
  display:flex;align-items:center;gap:4px}
input[type=text],input[type=number],input[type=date],textarea,select{
  background:var(--card2);border:.5px solid var(--br2);border-radius:var(--rad);
  padding:11px 12px;color:var(--tx);width:100%;outline:none;
  font-family:inherit;font-size:15px;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--b);
  box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{resize:none;line-height:1.55}
.ni{text-align:center;font-family:'SF Mono',monospace;padding-left:4px;padding-right:4px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pg{display:flex;gap:6px}
.pill{flex:1;padding:10px 4px;font-size:12px;font-weight:500;
  border:.5px solid var(--br2);border-radius:var(--rad);background:none;
  color:var(--tx2);cursor:pointer;text-align:center;font-family:inherit;transition:all .12s}
.pill:active{opacity:.7}
.ai{background:var(--bbg);border-color:var(--bbr);color:var(--b)}
.al{background:var(--gbg);border-color:var(--gbr);color:var(--g)}
.ash{background:var(--rbg);border-color:var(--rbr);color:var(--r)}
.pnl-prev{display:flex;align-items:baseline;justify-content:center;gap:8px;
  padding:12px;border-radius:var(--rad);margin-bottom:14px}
.pnl-prev-amt{font-family:'SF Mono',monospace;font-size:22px;font-weight:700}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;
  border:.5px dashed var(--br2);border-radius:var(--rad);padding:13px;
  cursor:pointer;color:var(--tx2);font-size:13px}
.m-imgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:9px;
  -webkit-overflow-scrolling:touch}
.m-ith{height:82px;border-radius:8px;border:.5px solid var(--br);object-fit:cover;flex-shrink:0}
.m-iwrap{position:relative;flex-shrink:0}
.m-idel{position:absolute;top:-6px;right:-6px;width:20px;height:20px;
  border-radius:50%;background:var(--r);border:none;color:#fff;
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  line-height:1;font-family:inherit;font-weight:700}
.pbtn{width:100%;padding:15px;background:var(--acc);color:var(--bg);border:none;
  border-radius:var(--rad);font-size:16px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:opacity .12s}
.pbtn:active{opacity:.8}
.pbtn:disabled{opacity:.3;cursor:not-allowed}

/* Separator */
.sec-sep{height:1px;background:var(--br);margin:0 0 12px}
</style>
</head>
<body>
<div id="root">
  <div id="hdr">
    <div>
      <div class="hdr-s">TRADING JOURNAL</div>
      <div class="hdr-t">交易複盤</div>
    </div>
    <button class="btn-add" id="btnAdd">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新增
    </button>
  </div>
  <div id="cnt"></div>
  <div id="nav">
    <button class="nb" id="navR">
      <span class="nb-ic">📋</span>
      <span class="nb-lb" id="lbR" style="color:var(--tx)">複盤記錄</span>
    </button>
    <button class="nb" id="navS">
      <span class="nb-ic">📊</span>
      <span class="nb-lb" id="lbS" style="color:var(--tx2)">月統計</span>
    </button>
  </div>
  <div id="modal"></div>
</div>

<script>
// ── IndexedDB ─────────────────────────────────────────────────────────────
let _db=null;
function getDB(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open('TJImgs',1);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('imgs'))
        db.createObjectStore('imgs',{keyPath:'id'});
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db);};
    r.onerror=()=>rej(r.error);
  });
}
async function dbSet(id,data){
  const db=await getDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('imgs','readwrite');
    tx.objectStore('imgs').put({id,data});
    tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
  });
}
async function dbGet(id){
  const db=await getDB();
  return new Promise(res=>{
    const r=db.transaction('imgs','readonly').objectStore('imgs').get(id);
    r.onsuccess=()=>res(r.result?.data||null);
    r.onerror=()=>res(null);
  });
}
async function dbDel(id){
  const db=await getDB();
  return new Promise(res=>{
    const tx=db.transaction('imgs','readwrite');
    tx.objectStore('imgs').delete(id);
    tx.oncomplete=res;tx.onerror=res;
  });
}

// ── Storage ───────────────────────────────────────────────────────────────
function loadTrades(){try{return JSON.parse(localStorage.getItem('tj-v3')||'[]');}catch{return[];}}
function saveTrades(ts){localStorage.setItem('tj-v3',JSON.stringify(ts));}

// ── State ─────────────────────────────────────────────────────────────────
const S={
  trades:loadTrades(),
  tab:'review',
  expandedId:null,
  statsMonth:curMo(),
  modal:null,   // null | {mode:'add'|'edit', id?}
  mForm:{},
  mImgs:[],     // [{id,data,isNew}]
  loading:false
};

function today(){return new Date().toISOString().slice(0,10);}
function curMo(){return new Date().toISOString().slice(0,7);}
function calcPnL(inst,dir,en,ex,qty){
  if(!en||!ex||!qty)return 0;
  return Math.round((dir==='long'?ex-en:en-ex)*qty*(inst==='台指期'?200:inst==='小台指'?50:1));
}
function fmt(n){return(n>0?'+':'')+n.toLocaleString();}
function uid(){return Date.now()+'_'+Math.random().toString(36).slice(2,7);}
function fileToB64(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.readAsDataURL(file);
  });
}

// ── Icons ─────────────────────────────────────────────────────────────────
const chevSvg='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
const editSvg='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
const trashSvg='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>';
const camSvg='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const boltSvg='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';

// ── Render ────────────────────────────────────────────────────────────────
function syncInputsToState(){
  const map={fDate:'date',fSym:'symbol',fEn:'entryPrice',fEx:'exitPrice',fQty:'quantity',fLog:'entryLogic',fImp:'improvement'};
  for(const[id,k]of Object.entries(map)){const el=document.getElementById(id);if(el)S.mForm[k]=el.value;}
}

function render(){
  document.getElementById('lbR').style.color=S.tab==='review'?'var(--tx)':'var(--tx2)';
  document.getElementById('lbS').style.color=S.tab==='stats'?'var(--tx)':'var(--tx2)';
  document.getElementById('cnt').innerHTML=S.tab==='review'?buildReview():buildStats();
  renderModal();
  bindContent();
}

function renderModal(){
  document.getElementById('modal').innerHTML=S.modal?buildModal():'';
  if(S.modal)bindModal();
}

// ── Review ────────────────────────────────────────────────────────────────
function buildReview(){
  if(!S.trades.length)return`<div class="empty">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity:.2"><rect x="3" y="3" width="18" height="13" rx="2"/><polyline points="8 21 12 17 16 21"/><line x1="12" y1="13" x2="12" y2="17"/></svg>
    <div>尚無交易記錄<br>點右上角「新增」開始記錄</div></div>`;
  const g={};
  S.trades.forEach(t=>{if(!g[t.date])g[t.date]=[];g[t.date].push(t);});
  const ds=Object.keys(g).sort((a,b)=>b.localeCompare(a));
  return`<div class="pad">`+ds.map(date=>{
    const dts=g[date],dp=dts.reduce((s,t)=>s+t.pnl,0);
    return`<div class="day-g">
      <div class="day-hdr${dp<0?' neg':''}">
        <span class="day-date">${date}</span>
        <span class="mono day-pnl ${dp>=0?'profit':'lossc'}">${fmt(dp)} TWD</span>
      </div>
      ${dts.map(t=>buildCard(t)).join('')}
    </div>`;
  }).join('')+'</div>';
}

function buildCard(t){
  const open=S.expandedId===t.id;
  const p=t.pnl>=0;
  return`<div class="tc">
    <div class="tc-top" data-toggle="${t.id}">
      <span class="dir dir-${t.direction==='long'?'l':'s'}">${t.direction==='long'?'多▲':'空▼'}</span>
      <div style="flex:1;min-width:0;">
        <div class="tc-name">${esc(t.instrument)}${t.symbol?` (${esc(t.symbol)})`:''}</div>
        <div class="tc-price">${t.entryPrice} → ${t.exitPrice}  ×${t.quantity}${t.instrument==='股票'?'股':'口'}</div>
      </div>
      <div class="tc-pnl">
        <div class="tc-pnl-num ${p?'profit':'lossc'}">${fmt(t.pnl)}</div>
        <div class="tc-pnl-unit">TWD</div>
      </div>
      <div class="chev${open?' op':''}">${chevSvg}</div>
    </div>
    ${open?`<div class="tc-det">
      ${t.imageIds&&t.imageIds.length?`<div class="imgs-wrap" data-imgs="${t.id}">
        ${t.imageIds.map(()=>'<div class="ith-ph"></div>').join('')}
      </div>`:''}
      ${t.entryLogic?`<div class="det-label">進出場邏輯</div><div class="tbox tlog">${escNl(t.entryLogic)}</div>`:''}
      ${t.improvement?`<div class="det-label-y">${boltSvg}改進點</div><div class="tbox timp">${escNl(t.improvement)}</div>`:''}
      <div class="act-row">
        <button class="act-edit" data-edit="${t.id}">${editSvg} 編輯</button>
        <button class="act-del" data-del="${t.id}">${trashSvg}</button>
      </div>
    </div>`:''}
  </div>`;
}

// ── Stats ─────────────────────────────────────────────────────────────────
function buildStats(){
  let mos=[...new Set(S.trades.map(t=>t.date.slice(0,7)))].sort((a,b)=>b.localeCompare(a));
  if(!mos.includes(curMo()))mos.unshift(curMo());
  if(!mos.includes(S.statsMonth))S.statsMonth=mos[0];
  const mt=S.trades.filter(t=>t.date.startsWith(S.statsMonth));
  const tp=mt.reduce((s,t)=>s+t.pnl,0);
  const ws=mt.filter(t=>t.pnl>0),ls=mt.filter(t=>t.pnl<0);
  const wr=mt.length?Math.round(ws.length/mt.length*100):0;
  const best=mt.length?Math.max(...mt.map(t=>t.pnl)):null;
  const worst=mt.length?Math.min(...mt.map(t=>t.pnl)):null;
  const aw=ws.length?Math.round(ws.reduce((s,t)=>s+t.pnl,0)/ws.length):null;
  const al=ls.length?Math.round(ls.reduce((s,t)=>s+t.pnl,0)/ls.length):null;
  const dm={};mt.forEach(t=>{dm[t.date]=(dm[t.date]||0)+t.pnl;});
  const days=Object.entries(dm).sort((a,b)=>b[0].localeCompare(a[0]));
  const SC=(lb,val,vc)=>`<div class="sc"><div class="sc-lb">${lb}</div><div class="sc-v" style="color:${vc||'var(--tx)'};">${val}</div></div>`;
  return`<div class="pad">
    <div class="mo-row">${mos.slice(0,10).map(m=>`<button class="mo-pill${m===S.statsMonth?' on':''}" data-month="${m}">${m}</button>`).join('')}</div>
    <div class="tot-card" style="background:${tp>=0?'var(--gbg)':'var(--rbg)'};border-color:${tp>=0?'var(--g)':'var(--r)'}">
      <div class="tot-lb">月度損益（TWD）</div>
      <div class="tot-amt ${tp>=0?'profit':'lossc'}">${fmt(tp)}</div>
      <div class="tot-sub">${S.statsMonth}  ·  ${mt.length} 筆交易</div>
    </div>
    <div class="sg">
      ${SC('勝率',wr+'%',wr>=50?'var(--g)':'var(--r)')}
      ${SC('交易次數',''+mt.length)}
      ${SC('最大獲利',best!==null&&best>0?'+'+best.toLocaleString():'--','var(--g)')}
      ${SC('最大虧損',worst!==null&&worst<0?worst.toLocaleString():'--','var(--r)')}
      ${SC('平均獲利',aw?'+'+aw.toLocaleString():'--','var(--g)')}
      ${SC('平均虧損',al?al.toLocaleString():'--','var(--r)')}
    </div>
    ${days.length?`<div class="day-sec-hdr">每日損益明細</div>`+days.map(([d,p])=>`<div class="drow">
      <div style="display:flex;align-items:center;gap:9px;">
        <div class="ddot" style="background:${p>=0?'var(--g)':'var(--r)'}"></div>
        <span class="mono" style="font-size:13px;color:var(--tx2);">${d}</span>
      </div>
      <span class="mono ${p>=0?'profit':'lossc'}" style="font-size:13px;font-weight:600;">${fmt(p)} TWD</span>
    </div>`).join(''):''}
  </div>`;
}

// ── Modal ─────────────────────────────────────────────────────────────────
function buildModal(){
  const isEdit=S.modal.mode==='edit';
  const f=S.mForm;
  const pp=calcPnL(f.instrument,f.direction,parseFloat(f.entryPrice)||0,parseFloat(f.exitPrice)||0,parseFloat(f.quantity)||0);
  const ok=!!(f.entryPrice&&f.exitPrice&&f.quantity);
  function pills(items,key){
    return items.map(o=>`<button class="pill${f[key]===o.v?' '+o.ac:''}" data-key="${key}" data-val="${o.v}">${o.lb}</button>`).join('');
  }
  return`<div id="modal-bg">
    <div class="m-sheet">
      <div class="m-han"></div>
      <div class="m-hd">
        <div class="m-hd-t">${isEdit?'編輯交易':'新增交易記錄'}</div>
        <button class="m-close" id="mClose">×</button>
      </div>
      <div class="m-scr">
        <div class="field"><div class="fl">交易日期</div>
          <input type="date" id="fDate" value="${f.date||today()}"></div>
        <div class="field"><div class="fl">商品類別</div>
          <div class="pg">${pills([{v:'台指期',lb:'台指期',ac:'ai'},{v:'小台指',lb:'小台指',ac:'ai'},{v:'股票',lb:'股票',ac:'ai'}],'instrument')}</div></div>
        ${f.instrument==='股票'?`<div class="field"><div class="fl">股票代號</div>
          <input type="text" id="fSym" value="${esc(f.symbol||'')}" placeholder="例：2330"></div>`:''}
        <div class="field"><div class="fl">方向</div>
          <div class="pg">${pills([{v:'long',lb:'多  ▲',ac:'al'},{v:'short',lb:'空  ▼',ac:'ash'}],'direction')}</div></div>
        <div class="g3" style="margin-bottom:14px;">
          <div><div class="fl">進場價格</div><input type="number" id="fEn" class="ni" value="${f.entryPrice||''}" placeholder="0" inputmode="decimal"></div>
          <div><div class="fl">出場價格</div><input type="number" id="fEx" class="ni" value="${f.exitPrice||''}" placeholder="0" inputmode="decimal"></div>
          <div><div class="fl">${f.instrument==='股票'?'股數':'口數'}</div><input type="number" id="fQty" class="ni" value="${f.quantity||''}" placeholder="1" inputmode="decimal"></div>
        </div>
        ${ok?`<div class="pnl-prev" style="background:${pp>=0?'var(--gbg)':'var(--rbg)'};">
          <span style="font-size:12px;color:var(--tx2);">預估損益</span>
          <span class="pnl-prev-amt ${pp>=0?'profit':'lossc'}">${fmt(pp)}</span>
          <span style="font-size:12px;color:var(--tx2);">TWD</span>
        </div>`:''}
        <div class="field"><div class="fl">${camSvg} 圖表 / 對帳單截圖</div>
          <label class="upl" for="fImg">${camSvg} 從相簿選取或拍照（可多張）
            <input type="file" id="fImg" accept="image/*" multiple style="display:none;"></label>
          ${S.mImgs.length?`<div class="m-imgs">${S.mImgs.map((img,i)=>`<div class="m-iwrap">
            <img src="${img.data}" class="m-ith" alt="">
            <button class="m-idel" data-mi="${i}">×</button>
          </div>`).join('')}</div>`:''}
        </div>
        <div class="field"><div class="fl">進出場邏輯</div>
          <textarea id="fLog" rows="3" placeholder="技術訊號、型態突破、進出場依據...">${esc(f.entryLogic||'')}</textarea></div>
        <div class="field"><div class="fl-y">${boltSvg}改進點</div>
          <textarea id="fImp" rows="3" style="border-color:var(--y);" placeholder="執行問題、心態、下次改進...">${esc(f.improvement||'')}</textarea></div>
      </div>
      <div class="m-ft">
        <button class="pbtn" id="btnSave"${ok?'':' disabled'}>${isEdit?'儲存更改':'記錄交易'}</button>
      </div>
    </div>
  </div>`;
}

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escNl(s){return esc(s).replace(/\n/g,'<br>');}

function updatePnlPreview(){
  const pp=calcPnL(S.mForm.instrument,S.mForm.direction,
    parseFloat(S.mForm.entryPrice)||0,parseFloat(S.mForm.exitPrice)||0,parseFloat(S.mForm.quantity)||0);
  const ok=!!(S.mForm.entryPrice&&S.mForm.exitPrice&&S.mForm.quantity);
  const sb=document.getElementById('btnSave');
  if(sb)sb.disabled=!ok;
  let pv=document.querySelector('.pnl-prev');
  if(ok){
    const html=`<span style="font-size:12px;color:var(--tx2);">預估損益</span>
      <span class="pnl-prev-amt ${pp>=0?'profit':'lossc'}">${fmt(pp)}</span>
      <span style="font-size:12px;color:var(--tx2);">TWD</span>`;
    if(!pv){
      pv=document.createElement('div');pv.className='pnl-prev';
      const g3=document.querySelector('.g3');if(g3)g3.after(pv);
    }
    pv.style.background=pp>=0?'var(--gbg)':'var(--rbg)';
    pv.innerHTML=html;
  }else if(pv)pv.remove();
}

// ── Bind Events ───────────────────────────────────────────────────────────
function bindContent(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.toggle;
      S.expandedId=(S.expandedId===id)?null:id;
      render();
      if(S.expandedId)loadCardImages(S.expandedId);
    });
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();openEdit(el.dataset.edit);});
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();doDelete(el.dataset.del);});
  });
  document.querySelectorAll('[data-month]').forEach(el=>{
    el.addEventListener('click',()=>{S.statsMonth=el.dataset.month;render();});
  });
}

function bindModal(){
  const mc=document.getElementById('mClose');
  if(mc)mc.addEventListener('click',closeModal);
  const mb=document.getElementById('modal-bg');
  if(mb)mb.addEventListener('click',e=>{if(e.target===mb)closeModal();});
  // Pills
  document.querySelectorAll('.pill[data-key]').forEach(el=>{
    el.addEventListener('click',()=>{
      syncInputsToState();
      S.mForm[el.dataset.key]=el.dataset.val;
      renderModal();
    });
  });
  // Inputs
  function bi(id,key){
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('input',()=>{S.mForm[key]=el.value;updatePnlPreview();});
  }
  bi('fDate','date');bi('fSym','symbol');
  bi('fEn','entryPrice');bi('fEx','exitPrice');bi('fQty','quantity');
  bi('fLog','entryLogic');bi('fImp','improvement');
  // Image upload
  const fImg=document.getElementById('fImg');
  if(fImg)fImg.addEventListener('change',async e=>{
    const files=Array.from(e.target.files);
    for(const f of files){
      const data=await fileToB64(f);
      S.mImgs.push({id:uid(),data,isNew:true});
    }
    renderModal();
  });
  // Image delete
  document.querySelectorAll('.m-idel[data-mi]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      S.mImgs.splice(parseInt(el.dataset.mi),1);
      renderModal();
    });
  });
  // Save
  const bs=document.getElementById('btnSave');
  if(bs)bs.addEventListener('click',doSave);
}

// ── Load Card Images (async) ──────────────────────────────────────────────
async function loadCardImages(tradeId){
  const t=S.trades.find(x=>x.id===tradeId);
  if(!t||!t.imageIds||!t.imageIds.length)return;
  const con=document.querySelector(`[data-imgs="${tradeId}"]`);
  if(!con)return;
  const imgs=await Promise.all(t.imageIds.map(id=>dbGet(id)));
  if(!document.querySelector(`[data-imgs="${tradeId}"]`))return; // card collapsed
  con.innerHTML=imgs.filter(Boolean).map(d=>`<img src="${d}" class="ith" alt="">`).join('');
}

// ── Actions ───────────────────────────────────────────────────────────────
function openAdd(){
  S.mImgs=[];
  S.mForm={date:today(),instrument:'台指期',symbol:'',direction:'long',
    entryPrice:'',exitPrice:'',quantity:'',entryLogic:'',improvement:''};
  S.modal={mode:'add'};
  renderModal();
}

async function openEdit(id){
  const t=S.trades.find(x=>x.id===id);if(!t)return;
  S.mForm={...t};
  // Load existing images from IndexedDB
  S.mImgs=[];
  if(t.imageIds&&t.imageIds.length){
    for(const imgId of t.imageIds){
      const data=await dbGet(imgId);
      if(data)S.mImgs.push({id:imgId,data,isNew:false});
    }
  }
  S.modal={mode:'edit',id:t.id};
  renderModal();
}

function closeModal(){S.modal=null;S.mImgs=[];renderModal();}

async function doSave(){
  const f=S.mForm;
  if(!f.entryPrice||!f.exitPrice||!f.quantity)return;
  // Save new images to IndexedDB
  const imageIds=[];
  for(const img of S.mImgs){
    if(img.isNew)await dbSet(img.id,img.data);
    imageIds.push(img.id);
  }
  // Delete removed images (when editing)
  if(S.modal.mode==='edit'){
    const origTrade=S.trades.find(t=>t.id===S.modal.id);
    if(origTrade&&origTrade.imageIds){
      for(const oid of origTrade.imageIds){
        if(!imageIds.includes(oid))await dbDel(oid);
      }
    }
  }
  const rec={
    id:S.modal.id||uid(),
    date:f.date||today(),instrument:f.instrument,symbol:f.symbol||'',
    direction:f.direction,
    entryPrice:parseFloat(f.entryPrice),exitPrice:parseFloat(f.exitPrice),quantity:parseFloat(f.quantity),
    pnl:calcPnL(f.instrument,f.direction,parseFloat(f.entryPrice),parseFloat(f.exitPrice),parseFloat(f.quantity)),
    entryLogic:f.entryLogic||'',improvement:f.improvement||'',
    imageIds,
    createdAt:S.modal.mode==='edit'?f.createdAt:new Date().toISOString()
  };
  if(S.modal.mode==='edit'){
    S.trades=S.trades.map(t=>t.id===rec.id?rec:t);
  }else{
    S.trades=[rec,...S.trades];
  }
  saveTrades(S.trades);
  S.modal=null;S.mImgs=[];
  render();
}

async function doDelete(id){
  if(!confirm('確定刪除此筆交易？'))return;
  const t=S.trades.find(x=>x.id===id);
  if(t&&t.imageIds)for(const imgId of t.imageIds)await dbDel(imgId);
  S.trades=S.trades.filter(x=>x.id!==id);
  if(S.expandedId===id)S.expandedId=null;
  saveTrades(S.trades);
  render();
}

// ── PWA Icon ──────────────────────────────────────────────────────────────
function makeIcon(){
  try{
    const c=document.createElement('canvas');c.width=c.height=512;
    const x=c.getContext('2d');
    x.fillStyle='#111827';
    if(x.roundRect){x.beginPath();x.roundRect(0,0,512,512,96);x.fill();}
    else{x.fillRect(0,0,512,512);}
    // Candlestick wicks
    x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=10;
    x.beginPath();x.moveTo(110,110);x.lineTo(110,420);x.stroke();
    x.beginPath();x.moveTo(256,80);x.lineTo(256,440);x.stroke();
    x.beginPath();x.moveTo(402,100);x.lineTo(402,430);x.stroke();
    // Candles
    x.fillStyle='#f87171';x.fillRect(80,180,60,160); // red
    x.fillStyle='#34d399';x.fillRect(226,130,60,140); // green
    x.fillStyle='#34d399';x.fillRect(372,120,60,200); // green
    const lnk=document.createElement('link');
    lnk.rel='apple-touch-icon';lnk.href=c.toDataURL();
    document.head.appendChild(lnk);
  }catch(e){}
}

// ── Init ──────────────────────────────────────────────────────────────────
makeIcon();
document.getElementById('btnAdd').addEventListener('click',openAdd);
document.getElementById('navR').addEventListener('click',()=>{S.tab='review';render();});
document.getElementById('navS').addEventListener('click',()=>{S.tab='stats';render();});
// Swipe down to close modal
let touchY=0;
document.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(!S.modal)return;
  const dy=e.changedTouches[0].clientY-touchY;
  if(dy>80){const sheet=document.querySelector('.m-sheet');if(sheet&&e.target.closest('.m-han'))closeModal();}
},{passive:true});

render();
</script>
